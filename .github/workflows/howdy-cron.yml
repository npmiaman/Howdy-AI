name: Howdy cron — drain pending matches

# Vercel Hobby caps project cron at once-per-day, so we use GH Actions to hit
# the worker on the production deploy. Free + no plan upgrade needed.
#
# Cadence note: GitHub throttles sub-5-min schedules hard and silently drops
# ticks (a "* * * * *" schedule really lands every 1-4h). Every 15 min is
# honored far more reliably. The saga only needs to advance a step at a time and
# the 20h fallback guarantees delivery, so 15 min is plenty.
#
# Required GitHub Actions secrets:
#   HOWDY_DEPLOYMENT_URL   — e.g. https://bridgecreatives.co  (no trailing slash)
#   CRON_SECRET            — must match the same env var on Vercel

on:
  schedule:
    - cron: "*/15 * * * *" # every 15 min (GitHub may still delay under load)
  workflow_dispatch: {} # also trigger manually from the Actions tab

concurrency:
  group: howdy-cron
  cancel-in-progress: false

jobs:
  drain:
    runs-on: ubuntu-latest
    steps:
      - name: Hit /api/howdy/process-pending
        env:
          BASE: ${{ secrets.HOWDY_DEPLOYMENT_URL }}
          SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$BASE" ] || [ -z "$SECRET" ]; then
            echo "Missing HOWDY_DEPLOYMENT_URL or CRON_SECRET secret" >&2
            exit 1
          fi
          status=$(curl -sS -o /tmp/body.json -w "%{http_code}" \
            -H "Authorization: Bearer $SECRET" \
            "$BASE/api/howdy/process-pending")
          echo "HTTP $status"
          cat /tmp/body.json || true
          # Treat anything 2xx as success.
          [[ "$status" =~ ^2 ]]
